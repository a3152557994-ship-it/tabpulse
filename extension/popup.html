<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 320px; margin: 0; padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #f8fafc; color: #111827; font-size: 13px;
    }
    h1 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .status { font-size: 12px; color: #64748b; margin-bottom: 10px; }
    button {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db;
      background: #fff; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px;
    }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .divider { border-top: 1px solid #e2e8f0; margin: 12px 0; }
    .field { margin-bottom: 8px; }
    .field label { display: block; font-size: 11px; color: #475569; margin-bottom: 3px; font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1;
      border-radius: 6px; font-size: 12px; font-family: inherit;
    }
    #msg { font-size: 12px; color: #059669; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>📡 万站回音 · TabPulse</h1>
  <div class="status" id="hub-status">正在连接本地中枢...</div>
  <button class="primary" id="open-hub">🧭 打开 hao123 总控台</button>

  <div class="divider"></div>
  <form id="quick-add">
    <div class="field">
      <label>把当前网页加入盯梢</label>
      <input id="site-name" placeholder="平台名称" required />
    </div>
    <div class="field">
      <input id="site-url" type="url" placeholder="https://..." required />
    </div>
    <div class="field" style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
      <select id="site-tier">
        <option value="red">🔴 红灯手发</option>
        <option value="yellow" selected>🟡 黄灯确认</option>
        <option value="green">🟢 绿灯后台</option>
      </select>
      <select id="site-cat">
        <option value="主力阵地">主力阵地</option>
        <option value="接单外包" selected>接单外包</option>
        <option value="开发者商店">开发者商店</option>
        <option value="长尾蹲守">长尾蹲守</option>
      </select>
    </div>
    <div class="field">
      <textarea id="site-ctx" rows="2" placeholder="备注背景（如：等甲方私信回复报价）"></textarea>
    </div>
    <button type="submit">＋ 加入静默盯梢</button>
    <div id="msg"></div>
  </form>
  <script src="popup.js"></script>
</body>
</html>
