<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="消息总管" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/mobile-icon.svg" />
  <title>消息总管 · 手机随身收件箱</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-hover: #1a2642;
      --border: #243352;
      --text: #f8fafc;
      --sub: #94a3b8;
      --primary: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      min-height: 100vh;
      padding-top: calc(104px + var(--safe-t));
      padding-bottom: calc(20px + var(--safe-b));
    }

    /* Top Header + Filter Tabs */
    .header-wrap {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding-top: var(--safe-t);
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px 8px;
    }
    .title-row { display: flex; align-items: center; gap: 8px; }
    .app-title { font-size: 18px; font-weight: 800; letter-spacing: 0.2px; }
    .total-red-pill {
      background: var(--red); color: #fff; font-size: 11.5px; font-weight: 800;
      padding: 2px 8px; border-radius: 999px; display: none;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.45);
    }
    .top-actions { display: flex; align-items: center; gap: 6px; }

    .btn {
      border: 1px solid var(--border); background: #1e293b; color: var(--text);
      padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.green { background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.45); color: #34d399; }
    .btn.red { background: var(--red); border-color: var(--red); color: #fff; }

    .filter-bar {
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; padding: 0 14px 9px; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .ftab {
      white-space: nowrap; padding: 5px 12px; border-radius: 999px;
      font-size: 12.5px; font-weight: 600; color: var(--sub);
      background: transparent; border: 1px solid transparent; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .ftab.active {
      color: #fff; background: #1e293b; border-color: #334155; font-weight: 700;
    }
    .ftab .mini-dot {
      background: var(--red); color: #fff; font-size: 10px; font-weight: 800;
      padding: 0 5px; border-radius: 999px; line-height: 15px;
    }

    /* Live Incoming Alert Banner */
    .alert-banner {
      position: fixed; top: calc(8px + var(--safe-t)); left: 12px; right: 12px; z-index: 200;
      background: #1e293b; border: 1.5px solid var(--red); border-radius: 16px;
      padding: 12px 14px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65);
      display: none; align-items: center; justify-content: space-between; gap: 10px;
      cursor: pointer; animation: slideDown 0.22s ease-out;
    }
    @keyframes slideDown {
      from { transform: translateY(-24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* WeChat-style Channel List */
    .inbox-wrap { padding: 6px 12px; }
    .section-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 4px 10px; font-size: 12px; color: var(--sub);
    }
    .channel-list {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
    }
    .channel-row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.055);
      cursor: pointer; transition: background 0.12s;
    }
    .channel-row:last-child { border-bottom: none; }
    .channel-row:active { background: var(--surface-hover); }
    .channel-row.has-unread {
      background: rgba(239, 68, 68, 0.07);
    }

    .avatar-box {
      position: relative; width: 48px; height: 48px; flex-shrink: 0;
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }
    .avatar.app { background: linear-gradient(135deg, #059669, #047857); }
    .avatar.cc { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
    .avatar.warn { background: linear-gradient(135deg, #d97706, #b45309); }

    .red-dot-badge {
      position: absolute; top: -5px; right: -5px;
      min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 999px; background: var(--red); color: #fff;
      font-size: 11.5px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--surface);
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.55);
    }

    .ch-body { flex: 1; min-width: 0; }
    .ch-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-bottom: 4px;
    }
    .ch-title-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .ch-title {
      font-size: 15.5px; font-weight: 700; color: #f8fafc;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ch-tag {
      font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px;
      background: rgba(148, 163, 184, 0.14); color: #cbd5e1; flex-shrink: 0;
    }
    .ch-time { font-size: 11.5px; color: #64748b; flex-shrink: 0; }
    .ch-snippet {
      font-size: 13px; color: var(--sub);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .channel-row.has-unread .ch-snippet {
      color: #f1f5f9; font-weight: 600;
    }

    /* Tools View (Quick Replies & Lead Radar) */
    .tools-wrap { display: none; padding: 8px 12px; }
    .tools-wrap.active { display: block; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 15px; padding: 14px; margin-bottom: 12px;
    }

    /* Full-Screen Pure-Text Conversation View (ZERO Screenshots!) */
    .chat-page {
      position: fixed; inset: 0; z-index: 120;
      background: var(--bg); display: none; flex-direction: column;
    }
    .chat-page.open { display: flex; }

    .chat-nav {
      padding: calc(10px + var(--safe-t)) 12px 10px;
      background: #0f172a; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .chat-nav-center { flex: 1; text-align: center; min-width: 0; }
    .chat-nav-title {
      font-size: 15.5px; font-weight: 800;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-nav-sub { font-size: 11px; color: #34d399; margin-top: 2px; }

    /* Contact / Thread Switcher Pills inside Platform */
    .thread-bar {
      background: #11192c; border-bottom: 1px solid var(--border);
      padding: 8px 12px; display: none; gap: 7px; overflow-x: auto; scrollbar-width: none;
    }
    .thread-bar::-webkit-scrollbar { display: none; }
    .thread-pill {
      white-space: nowrap; padding: 5px 11px; border-radius: 999px;
      font-size: 12px; background: #1e293b; border: 1px solid #334155;
      color: #e2e8f0; cursor: pointer;
    }
    .thread-pill.active {
      background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700;
    }

    /* Pure-Text Message Bubbles */
    .msg-stream {
      flex: 1; overflow-y: auto; padding: 14px 12px 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg-bubble {
      max-width: 88%; padding: 10px 13px; border-radius: 15px;
      font-size: 14.5px; line-height: 1.55; word-break: break-word; white-space: pre-wrap;
      user-select: text; -webkit-user-select: text;
    }
    .msg-bubble.peer {
      align-self: flex-start;
      background: #1a253d; border: 1px solid #2b3b5e; color: #f8fafc;
      border-bottom-left-radius: 4px;
    }
    .msg-bubble.me {
      align-self: flex-end;
      background: var(--primary); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .ask-opts {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .ask-opt-btn {
      border: 1px solid #3b82f6; background: rgba(37, 99, 235, 0.22); color: #bfdbfe;
      padding: 8px 13px; border-radius: 10px; font-size: 13.5px; font-weight: 700;
      cursor: pointer;
    }
    .ask-opt-btn:active { background: #2563eb; color: #fff; transform: scale(0.97); }
    .ask-done-tag {
      margin-top: 8px; font-size: 12px; color: #34d399; font-weight: 700;
    }
    .msg-meta {
      font-size: 11px; color: #64748b; text-align: center; margin: 4px 0;
    }
    .empty-state {
      text-align: center; color: var(--sub); font-size: 13.5px;
      padding: 40px 20px; line-height: 1.65;
    }

    /* Bottom Reply Bar */
    .reply-dock {
      background: #0f172a; border-top: 1px solid var(--border);
      padding: 8px 10px calc(10px + var(--safe-b));
    }
    .qr-chips {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none;
    }
    .qr-chips::-webkit-scrollbar { display: none; }
    .qr-chip {
      white-space: nowrap; font-size: 12px; padding: 4px 10px;
      border-radius: 999px; background: #1e293b; border: 1px solid #334155;
      color: #cbd5e1; cursor: pointer;
    }
    .warn-tip {
      display: none; font-size: 11.5px; color: #fbbf24;
      background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 8px; padding: 5px 9px; margin-bottom: 7px;
    }
    .reply-row { display: flex; align-items: flex-end; gap: 8px; }
    .reply-input {
      flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff;
      border-radius: 14px; padding: 10px 12px; font-size: 15px; line-height: 1.4;
      max-height: 110px; min-height: 42px; resize: none; font-family: inherit;
    }
    .reply-input:focus { outline: none; border-color: #60a5fa; }
    .send-btn {
      height: 42px; padding: 0 16px; border-radius: 13px; border: none;
      background: var(--primary); color: #fff; font-size: 14.5px; font-weight: 800;
      cursor: pointer; flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.5; }

    /* Modal Sheet for Adding Platform / Opening App / New AI Task */
    .sheet-mask {
      position: fixed; inset: 0; z-index: 160; background: rgba(0, 0, 0, 0.68);
      display: none; align-items: flex-end;
    }
    .sheet-mask.open { display: flex; }
    .sheet {
      width: 100%; background: #162033; border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 18px 16px calc(22px + var(--safe-b)); border-top: 1px solid var(--border);
      max-height: 82vh; overflow-y: auto;
    }
    .field {
      width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff;
      padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 10px;
    }
    .toast {
      position: fixed; bottom: calc(82px + var(--safe-b)); left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96); border: 1px solid #475569; color: #fff;
      padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 250;
      display: none; white-space: nowrap; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- Clickable Incoming Message Banner -->
  <div class="alert-banner" id="alert-banner" onclick="openBannerTarget()">
    <div style="min-width:0">
      <div style="font-size:13.5px;font-weight:800;color:#fca5a5" id="banner-title">🔴 收到新消息</div>
      <div style="font-size:12.5px;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px" id="banner-body">点此直接进入查看并回复</div>
    </div>
    <span class="btn red" style="flex-shrink:0">查看 ›</span>
  </div>

  <!-- Fixed Header & Filter Bar -->
  <div class="header-wrap">
    <div class="topbar">
      <div class="title-row">
        <span class="app-title">消息总管</span>
        <span class="total-red-pill" id="total-red-pill">0</span>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="btn-push" onclick="enablePhonePush()">🔔 开启提醒</button>
        <button class="btn" onclick="testPhoneAlert()">测提醒</button>
      </div>
    </div>
    <div class="filter-bar">
      <button class="ftab active" data-filter="all" onclick="setFilter('all', this)">
        全部消息 <span class="mini-dot" id="dot-all" style="display:none">0</span>
      </button>
      <button class="ftab" data-filter="web" onclick="setFilter('web', this)">
        网页平台 <span class="mini-dot" id="dot-web" style="display:none">0</span>
      </button>
      <button class="ftab" data-filter="app" onclick="setFilter('app', this)">
        电脑软件 <span class="mini-dot" id="dot-app" style="display:none">0</span>
      </button>
      <button class="ftab" data-filter="cc" onclick="setFilter('cc', this)">
        Claude/AI <span class="mini-dot" id="dot-cc" style="display:none">0</span>
      </button>
      <button class="ftab" data-filter="tools" onclick="setFilter('tools', this)">
        话术/找单
      </button>
    </div>
  </div>

  <!-- Main Unified Red-Dot Channel List -->
  <div class="inbox-wrap" id="inbox-wrap">
    <div class="section-toolbar">
      <span id="conn-hint">🟢 已连家里电脑 · 来消息自动亮红点</span>
      <div style="display:flex;gap:6px">
        <button class="btn" style="padding:4px 9px;font-size:11.5px" onclick="openAddSheet()">＋ 添加监控/软件</button>
      </div>
    </div>
    <div class="channel-list" id="channel-list">
      <div class="empty-state">正在同步各平台与电脑软件消息...</div>
    </div>
  </div>

  <!-- Quick Replies & Buyer Lead Radar View -->
  <div class="tools-wrap" id="tools-wrap">
    <div class="card">
      <div style="font-size:14.5px;font-weight:800;margin-bottom:6px">⚡ 防封随机快捷话术</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:10px">支持 <code>{你好呀|哈喽|嗨亲}</code> 自动抽词防平台判重，点进任意聊天即可一键填入。</div>
      <div id="qr-manage-list" style="margin-bottom:10px"></div>
      <input class="field" id="new-qr-title" placeholder="话术简称（如：报价破冰）" />
      <input class="field" id="new-qr-text" placeholder="内容（如：{你好呀|哈喽}，现在有现货可直接安排～）" />
      <button class="btn primary" style="width:100%;justify-content:center;padding:9px" onclick="addQuickReply()">＋ 保存快捷话术</button>
    </div>

    <div class="card">
      <div style="font-size:14.5px;font-weight:800;margin-bottom:8px">🎯 全网求购线索搜索</div>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <input class="field" id="lead-q" value="闲鱼 自动化 工具" style="margin-bottom:0;flex:1" placeholder="输入关键词找客户..." />
        <button class="btn primary" onclick="scanLeads()">搜索</button>
      </div>
      <div id="lead-list" style="font-size:12.5px;color:var(--sub)">输入关键词即可抓取最新真实求购帖。</div>
    </div>
  </div>

  <!-- Full-Screen Pure-Text Platform Chat Page (ZERO Computer Screenshots!) -->
  <div class="chat-page" id="chat-page">
    <div class="chat-nav">
      <button class="btn" id="btn-back" onclick="closeChatPage()">‹ 消息</button>
      <div class="chat-nav-center">
        <div class="chat-nav-title" id="chat-title">平台消息</div>
        <div class="chat-nav-sub" id="chat-sub">纯文字同步 · 电脑固定网络代发</div>
      </div>
      <button class="btn" onclick="refreshActiveChannel(true)">刷新</button>
    </div>

    <!-- Clickable Conversation / Contact Threads inside this Platform/App -->
    <div class="thread-bar" id="thread-bar"></div>

    <!-- Pure-Text Bubbles -->
    <div class="msg-stream" id="msg-stream"></div>

    <!-- Direct Reply Input Dock -->
    <div class="reply-dock">
      <div id="butler-draft-box" style="display:none;background:rgba(37,99,235,0.14);border:1px solid rgba(96,165,250,0.4);border-radius:12px;padding:9px 11px;margin-bottom:8px;"></div>
      <div class="qr-chips" id="chat-qr-chips"></div>
      <div class="warn-tip" id="sensitive-warn"></div>
      <div class="reply-row">
        <textarea class="reply-input" id="reply-input" rows="1" placeholder="直接输入回复内容..." oninput="onReplyInput()"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendActiveReply()">发送</button>
      </div>
    </div>
  </div>

  <!-- Add Watch / Launch App / New CC Task Sheet -->
  <div class="sheet-mask" id="add-sheet" onclick="if(event.target===this)closeAddSheet()">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <strong style="font-size:16px">＋ 添加监控平台 / 打开电脑软件</strong>
        <button class="btn" onclick="closeAddSheet()">关闭</button>
      </div>

      <div style="font-size:12.5px;font-weight:700;color:#93c5fd;margin-bottom:6px">1. 添加网页平台监控</div>
      <input class="field" id="add-web-name" placeholder="名称（如：闲鱼消息 / 小红书私信 / Reddit）" />
      <input class="field" id="add-web-url" placeholder="网址 https://..." />
      <button class="btn primary" style="width:100%;justify-content:center;padding:9px;margin-bottom:16px" onclick="createWebWatch()">添加网页监控</button>

      <div style="font-size:12.5px;font-weight:700;color:#34d399;margin-bottom:6px">2. 远程唤醒电脑已装软件</div>
      <div id="installed-apps-box" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px"></div>

      <div style="font-size:12.5px;font-weight:700;color:#c4b5fd;margin-bottom:6px">3. 新建 Claude Code / AI 终端任务</div>
      <input class="field" id="add-cc-cwd" placeholder="项目目录（留空默认主目录）" />
      <button class="btn" style="width:100%;justify-content:center;padding:9px" onclick="createCcSession()">＋ 新建 Claude/AI 会话</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let hubState = { watches: [], quickReplies: [], stats: {} };
    let desktopState = { windows: [], badges: [], recentAlerts: [], installedApps: [] };
    let ccState = { sessions: [], hookEvents: [], agents: [] };
    let aiInboxState = { channels: [] };
    let aiButlerState = { suggestions: {}, events: [] };

    let currentFilter = "all";
    let unifiedChannels = [];
    let activeChannel = null; // { key, kind: 'web'|'app'|'cc', id, windowId, appName, title, ... }
    let activeThreadIdx = -1;
    let activeMessagesCache = [];

    let prevUnreadMap = new Map();
    let initializedUnreadBaseline = false;
    let seenHookIds = new Set();
    let ccUnreadSet = new Set();
    let bannerTargetKey = "";
    let swReg = null;
    let audioCtx = null;

    const SENSITIVE_PATTERNS = [
      { re: /微信|vx|v信|威信|加v|wx号|\bwechat\b/i, label: "微信号引流词（闲鱼/小红书易触发风控拦截）" },
      { re: /qq号|加q|扣扣|支付宝|转账|私下交易/i, label: "站外导流/私下交易敏感词" },
      { re: /\b1[3-9]\d{9}\b/, label: "11位手机号（易被平台屏蔽）" },
    ];

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => (el.style.display = "none"), 2400);
    }

    function spinText(tpl) {
      return String(tpl || "").replace(/\{([^{}|]+(?:\|[^{}|]+)+)\}/g, (_, g) => {
        const opts = g.split("|").filter(Boolean);
        return opts[Math.floor(Math.random() * opts.length)] || "";
      });
    }

    function unlockAudio() {
      try {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      } catch {}
    }
    document.addEventListener("touchstart", unlockAudio, { once: true, passive: true });
    document.addEventListener("click", unlockAudio, { once: true });

    function playAlertChime() {
      try {
        if (navigator.vibrate) navigator.vibrate([120, 60, 140]);
        if (!audioCtx) unlockAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1174, now + 0.11);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.33);
      } catch {}
    }

    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 45) return "刚刚";
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      if (d.toDateString() === now.toDateString()) {
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function pickIcon(name, kind) {
      const n = String(name || "").toLowerCase();
      if (n.includes("微信") || n.includes("wechat")) return "💬";
      if (n.includes("闲鱼") || n.includes("goofish")) return "🐟";
      if (n.includes("小红书") || n.includes("xiaohongshu")) return "📕";
      if (n.includes("claude")) return "🤖";
      if (n.includes("gemini")) return "✨";
      if (n.includes("reddit")) return "👽";
      if (n.includes("x ") || n.includes("twitter") || n.includes("x私信")) return "𝕏";
      if (n.includes("telegram")) return "✈️";
      if (n.includes("飞书") || n.includes("lark")) return "🐦";
      if (n.includes("钉钉")) return "📌";
      if (n.includes("千牛") || n.includes("旺旺")) return "🐮";
      if (n.includes("电鸭") || n.includes("v2ex")) return "⚡";
      if (kind === "app") return "💻";
      if (kind === "cc") return "⌨️";
      return (String(name || "信").trim()[0] || "信").toUpperCase();
    }

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...opts,
      });
      return res.json();
    }

    /* ---------------- Web Push (VAPID) + App Badge ---------------- */
    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function initServiceWorkerAndPushStatus() {
      if (!("serviceWorker" in navigator)) return;
      try {
        swReg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        navigator.serviceWorker.addEventListener("message", (ev) => {
          if (ev.data?.action === "openChannel" && ev.data.targetKey) {
            openChannelByKey(ev.data.targetKey);
          }
        });
        if (swReg.pushManager) {
          const existing = await swReg.pushManager.getSubscription();
          if (existing) markPushEnabledUI();
        } else if ("Notification" in window && Notification.permission === "granted") {
          markPushEnabledUI();
        }
      } catch {}
    }

    function markPushEnabledUI() {
      const btn = document.getElementById("btn-push");
      btn.textContent = "✅ 提醒已开";
      btn.className = "btn green";
    }

    async function enablePhonePush() {
      unlockAudio();
      try {
        if ("Notification" in window) {
          const perm = await Notification.requestPermission();
          if (perm !== "granted") {
            showToast("请在手机浏览器设置中允许通知权限");
            return;
          }
        }
        if ("serviceWorker" in navigator) {
          swReg = swReg || (await navigator.serviceWorker.register("/sw.js", { scope: "/" }));
          await navigator.serviceWorker.ready;
          if (swReg && swReg.pushManager) {
            const keyRes = await api("/api/push/vapid-public-key");
            if (keyRes.ok && keyRes.publicKey) {
              const sub = await swReg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(keyRes.publicKey),
              });
              await api("/api/push/subscribe", {
                method: "POST",
                body: JSON.stringify({ subscription: sub }),
              });
              markPushEnabledUI();
              showToast("✅ 手机锁屏推送与红点提醒已开启！");
              return;
            }
          }
        }
        if ("Notification" in window && Notification.permission === "granted") {
          markPushEnabledUI();
          showToast("✅ 实时提醒已开启！（iPhone 添加到主屏幕可解锁锁屏推送）");
          return;
        }
        showToast("iPhone 请点底部「分享 → 添加到主屏幕」后再点开启锁屏提醒");
      } catch (err) {
        showToast("提示：iPhone 添加到主屏幕后支持锁屏推送 (" + (err.message || "已启用前台提醒") + ")");
      }
    }

    /* ---------------- Unified Red-Dot Channel Builder ---------------- */
    function buildUnifiedChannels() {
      const list = [];

      // 1. Web Platform Watches
      for (const w of hubState.watches || []) {
        const unread = w.status === "unread" ? Math.max(1, Number(w.unreadCount) || 1) : 0;
        const authWarn = w.status === "auth_expired";
        list.push({
          key: `web:${w.id}`,
          kind: "web",
          tag: authWarn ? "需登录" : "网页平台",
          id: w.id,
          title: w.name,
          unreadCount: unread,
          authWarn,
          snippet: authWarn
            ? "⚠️ 电脑端登录已过期，请在电脑端刷新一次登录"
            : w.snippet || w.contextSummary || "暂无新未读消息，点击直接查看最近会话",
          updatedAt: w.lastUnreadAt || w.lastCheckedAt || "",
          icon: pickIcon(w.name, "web"),
        });
      }

      // 2. Native Desktop Software Windows + Dock Badges
      const seenApps = new Set();
      const BROWSER_SET = new Set(["Google Chrome", "Safari", "Brave Browser", "Arc", "Firefox"]);
      for (const win of desktopState.windows || []) {
        if (!win.appName || win.appName === "消息总管" || win.appName === "ReplyRadar") continue;
        if (seenApps.has(win.appName)) continue;
        const unread = Number(win.unreadCount) || 0;
        if (BROWSER_SET.has(win.appName) && unread === 0) continue;
        const appKey = `app:${win.appName}:${win.windowId}`;
        seenApps.add(win.appName);
        list.push({
          key: appKey,
          appMatchKey: `app:${win.appName}`,
          kind: "app",
          tag: "电脑软件",
          windowId: win.windowId,
          appName: win.appName,
          title: win.appName,
          unreadCount: unread,
          snippet: win.snippet || `点击查看 ${win.appName} 当前纯文字消息并回复`,
          updatedAt: "",
          icon: pickIcon(win.appName, "app"),
        });
      }

      // Also surface Dock-badged apps whose window might currently be minimized/closed
      for (const b of desktopState.badges || []) {
        if (seenApps.has(b.name) || b.name === "消息总管") continue;
        const cnt = parseInt(b.badge, 10) || 1;
        const matchedApp = (desktopState.installedApps || []).find((a) => a.name === b.name);
        list.push({
          key: `app:${b.name}:dock`,
          appMatchKey: `app:${b.name}`,
          kind: "app",
          tag: "电脑软件",
          windowId: 0,
          appPath: matchedApp?.path || "",
          appName: b.name,
          title: b.name,
          unreadCount: cnt,
          snippet: `收到 ${b.badge} 条未读红点消息，点击唤醒窗口并查看文字`,
          updatedAt: "",
          icon: pickIcon(b.name, "app"),
        });
      }

      // 3. Plug-and-Play AI MCP Channels (tabpulse_notify_phone / tabpulse_ask_human)
      for (const aic of aiInboxState.channels || []) {
        list.push({
          key: aic.key,
          kind: "cc",
          subKind: "ai-inbox",
          channelId: aic.id,
          tag: aic.hasPendingAsk ? "❓等你拍板" : "AI主动提醒",
          title: aic.agentName,
          unreadCount: Number(aic.unreadCount) || 0,
          snippet: aic.snippet || "AI 自动推送与手机一键拍板通道",
          updatedAt: aic.updatedAt || "",
          icon: "🤖",
        });
      }

      // 4. Claude Code / Local AI Sessions & Terminal Hook Alerts
      if ((ccState.hookEvents || []).length > 0) {
        const latestHook = ccState.hookEvents[0];
        if (!seenHookIds.has(latestHook.id) && initializedUnreadBaseline) {
          ccUnreadSet.add("cc:hooks");
        }
        for (const hk of ccState.hookEvents) seenHookIds.add(hk.id);
        list.push({
          key: "cc:hooks",
          kind: "cc",
          tag: "Claude终端",
          sessionId: "",
          title: "Claude Code 电脑终端动态",
          unreadCount: ccUnreadSet.has("cc:hooks") ? 1 : 0,
          snippet: latestHook.summary || "终端任务已完成",
          updatedAt: latestHook.createdAt || "",
          icon: "🤖",
        });
      }

      for (const s of ccState.sessions || []) {
        const lastMsg = (s.messages || [])[s.messages.length - 1];
        list.push({
          key: `cc:${s.id}`,
          kind: "cc",
          tag: s.status === "running" ? "执行中..." : "AI任务",
          sessionId: s.id,
          title: s.name,
          unreadCount: ccUnreadSet.has(`cc:${s.id}`) ? 1 : 0,
          snippet: lastMsg ? lastMsg.text.replace(/\s+/g, " ").slice(-90) : "点击发送指令给家里电脑执行",
          updatedAt: s.updatedAt || s.createdAt || "",
          icon: "🤖",
        });
      }

      // Sort: items with red unread dots ALWAYS float to the very top!
      list.sort((a, b) => {
        if ((b.unreadCount > 0) !== (a.unreadCount > 0)) {
          return b.unreadCount > 0 ? 1 : -1;
        }
        if (b.unreadCount !== a.unreadCount) return b.unreadCount - a.unreadCount;
        return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
      });

      return list;
    }

    function checkIncomingAlertsAndBadges(channels) {
      let totalUnread = 0;
      let webUnread = 0;
      let appUnread = 0;
      let ccUnread = 0;

      for (const ch of channels) {
        const c = Number(ch.unreadCount) || 0;
        totalUnread += c;
        if (ch.kind === "web") webUnread += c;
        if (ch.kind === "app") appUnread += c;
        if (ch.kind === "cc") ccUnread += c;

        const prev = prevUnreadMap.get(ch.key) || 0;
        if (initializedUnreadBaseline && c > prev) {
          if (!activeChannel || activeChannel.key !== ch.key) {
            playAlertChime();
            triggerLocalBanner(`🔴 ${ch.title} (${c}条未读)`, ch.snippet, ch.key);
          }
        }
        prevUnreadMap.set(ch.key, c);
      }
      initializedUnreadBaseline = true;

      // Update Top Red Pill & Filter Dots
      const pill = document.getElementById("total-red-pill");
      if (totalUnread > 0) {
        pill.textContent = `${totalUnread} 未读`;
        pill.style.display = "inline-block";
        document.title = `(${totalUnread}) 消息总管`;
      } else {
        pill.style.display = "none";
        document.title = "消息总管 · 手机随身收件箱";
      }

      const setDot = (id, n) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = n > 99 ? "99+" : String(n);
        el.style.display = n > 0 ? "inline-block" : "none";
      };
      setDot("dot-all", totalUnread);
      setDot("dot-web", webUnread);
      setDot("dot-app", appUnread);
      setDot("dot-cc", ccUnread);

      const backBtn = document.getElementById("btn-back");
      if (backBtn) backBtn.textContent = totalUnread > 0 ? `‹ 消息(${totalUnread})` : "‹ 消息";

      if ("setAppBadge" in navigator) {
        if (totalUnread > 0) navigator.setAppBadge(totalUnread).catch(() => {});
        else if ("clearAppBadge" in navigator) navigator.clearAppBadge().catch(() => {});
      }
    }

      if (!filtered.length) {
        box.innerHTML = `<div class="empty-state">当前分类下暂无会话。<br/>可点击右上角「＋ 添加监控/软件」添加平台或唤醒电脑软件。</div>`;
        return;
      }

      box.innerHTML = filtered
        .map((ch) => {
          const avCls = ch.authWarn ? "warn" : ch.kind === "app" ? "app" : ch.kind === "cc" ? "cc" : "";
          const badgeHtml =
            ch.unreadCount > 0
              ? `<span class="red-dot-badge">${ch.unreadCount > 99 ? "99+" : ch.unreadCount}</span>`
              : "";

            <div class="channel-row ${ch.unreadCount > 0 ? "has-unread" : ""}" onclick="openChannelByKey('${esc(ch.key)}')">
              <div class="avatar-box">
                <div class="avatar ${avCls}">${esc(ch.icon)}</div>
                ${badgeHtml}
              </div>

                <div class="ch-top">

                </div>
                <div class="ch-snippet">${esc(ch.snippet)}</div>

    function setFilter(f, btnEl) {
      currentFilter = f;
      document.querySelectorAll(".ftab").forEach((b) => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");

      const inbox = document.getElementById("inbox-wrap");
      const tools = document.getElementById("tools-wrap");
      if (f === "tools") {
        inbox.style.display = "none";
        tools.classList.add("active");
        renderQuickRepliesManage();
      } else {
        tools.classList.remove("active");
        inbox.style.display = "block";
        renderChannelList();

    }

    /* ---------------- Open Pure-Text Platform Chat Page ---------------- */
    async function openChannelByKey(targetKey) {
      if (!targetKey) return;
      let ch = unifiedChannels.find(
        (c) => c.key === targetKey || c.appMatchKey === targetKey || (targetKey === "cc:latest" && c.kind === "cc")
      );
      if (!ch) {
        await pollAll();
        ch = unifiedChannels.find(
          (c) => c.key === targetKey || c.appMatchKey === targetKey || (targetKey === "cc:latest" && c.kind === "cc")
        );
      }
      if (!ch) {
        showToast("未找到对应会话，已为您打开总收件箱");
        return;
      }

      activeChannel = ch;
      activeThreadIdx = -1;
      document.getElementById("chat-title").textContent = ch.title;
      document.getElementById("chat-sub").textContent =
        ch.kind === "web"
          ? "网页平台纯文字同步 · 家里电脑固定IP代发"
          : ch.kind === "app"
            ? "电脑原生软件纯文字提取 · 直接回复"
            : "电脑本地 AI 终端 · 实时文字交互";

      document.getElementById("thread-bar").style.display = "none";
      document.getElementById("msg-stream").innerHTML = `<div class="empty-state">⏳ 正在读取「${esc(ch.title)}」的最新文字消息...</div>`;
      renderButlerDraftBar(ch);
      renderChatQuickReplyChips();
      document.getElementById("chat-page").classList.add("open");

      // Clear Red Dot Immediately!
      if (ch.kind === "web" && ch.unreadCount > 0) {
        api(`/api/watches/${encodeURIComponent(ch.id)}/resolve`, {
          method: "POST",
          body: JSON.stringify({ action: "resolve" }),
        }).catch(() => {});
      } else if (ch.kind === "app") {
        if (!ch.windowId && ch.appPath) {
          await api("/api/desktop/launch", { method: "POST", body: JSON.stringify({ path: ch.appPath }) });
          await new Promise((r) => setTimeout(r, 900));
          await pollAll();
          const reopened = unifiedChannels.find((x) => x.appName === ch.appName && x.windowId);
          if (reopened) activeChannel = reopened;
        }
        api("/api/desktop/clear-unread", {
          method: "POST",
          body: JSON.stringify({ appName: ch.appName }),
        }).catch(() => {});
      } else if (ch.kind === "cc") {
        if (ch.subKind === "ai-inbox") {
          api("/api/ai-inbox/clear-unread", {
            method: "POST",
            body: JSON.stringify({ channelId: ch.channelId }),
          }).catch(() => {});
        } else {
          ccUnreadSet.delete(ch.key);
        }
      }

      ch.unreadCount = 0;
      prevUnreadMap.set(ch.key, 0);
      checkIncomingAlertsAndBadges(unifiedChannels);
      renderChannelList();

      await refreshActiveChannel(false);
    }

    function closeChatPage() {
      activeChannel = null;
      if (location.hash.startsWith("#open=")) {
        history.replaceState(null, "", location.pathname + location.search);
      }
      document.getElementById("chat-page").classList.remove("open");
      pollAll();
    }

    async function refreshActiveChannel(manualToast = false) {
      if (!activeChannel) return;
      const ch = activeChannel;

      if (ch.kind === "web") {
        const res = await api(`/api/remote/tab/${encodeURIComponent(ch.id)}/snapshot`);
        const snap = res.ok ? res : res.cachedSnapshot || {};
        renderPureTextConversation({
          threads: snap.threads || [],
          messages: snap.messages || [],
          authRequired: snap.authRequired || ch.authWarn,
          fallbackSnippet: ch.snippet,
          errorHint: !res.ok && !snap.messages ? res.error : "",
        });
        if (manualToast) showToast("已同步最新平台消息");
        return;
      }

      if (ch.kind === "app") {
        if (!ch.windowId) {
          renderPureTextConversation({
            threads: [],
            messages: [],
            fallbackSnippet: ch.snippet || "该软件窗口当前最小化，点击发送或电脑打开后即可同步文字内容。",
          });
          return;
        }
        const res = await api(`/api/desktop/window/${ch.windowId}/messages`);
        const combinedMsgs = [];
        if (Array.isArray(res.bannerHistory)) {
          for (const b of res.bannerHistory) {
            combinedMsgs.push({ text: b.text, isMe: Boolean(b.isMe) });
          }
        }
        for (const m of res.messages || []) {
          if (!combinedMsgs.some((x) => x.text === m.text)) {
            combinedMsgs.push(m);
          }
        }
        renderPureTextConversation({
          threads: res.threads || [],
          messages: combinedMsgs,
          fallbackSnippet: ch.snippet,
          errorHint: !res.ok ? res.error : "",
        });
        if (manualToast) showToast("已同步最新软件文字");
        return;
      }

      if (ch.kind === "cc") {
        if (ch.subKind === "ai-inbox") {
          const aRes = await api("/api/ai-inbox/state").catch(() => null);
          if (aRes && aRes.channels) aiInboxState = aRes;
          const found = (aiInboxState.channels || []).find((x) => x.id === ch.channelId);
          const msgs = (found?.messages || []).map((m) => ({
            text: m.text,
            isMe: m.role === "user",
            isQuestion: Boolean(m.isQuestion),
            answered: Boolean(m.answered),
            answer: m.answer || "",
            requestId: m.requestId || "",
            options: m.options || [],
            channelId: ch.channelId,
          }));
          renderPureTextConversation({
            threads: [],
            messages: msgs,
            fallbackSnippet: "AI 正在后台运行，需要通知或拍板时会自动推送到这里。",
          });
          if (manualToast) showToast("已同步 AI 最新通知");
          return;
        }
        await pollCcOnly();
        if (ch.key === "cc:hooks") {
          const msgs = (ccState.hookEvents || [])
            .slice()
            .reverse()
            .map((h) => ({
              text: `[${h.eventType}] ${h.cwd ? h.cwd + "\n" : ""}${h.summary}`,
              isMe: false,
            }));
          renderPureTextConversation({ threads: [], messages: msgs, fallbackSnippet: "暂无终端通知记录" });
        } else {
          const s = (ccState.sessions || []).find((x) => x.id === ch.sessionId);
          const msgs = (s?.messages || []).map((m) => ({
            text: m.text,
            isMe: m.role === "user",
          }));
          renderPureTextConversation({ threads: [], messages: msgs, fallbackSnippet: "可直接输入指令交给电脑 Claude Code 执行" });
        }
        if (manualToast) showToast("已刷新 AI 会话输出");
      }
    }

    function renderPureTextConversation({ threads = [], messages = [], authRequired = false, fallbackSnippet = "", errorHint = "" }) {
      // 1. Thread Switcher Bar
      const tbar = document.getElementById("thread-bar");
      if (threads.length > 0) {
        tbar.style.display = "flex";
        tbar.innerHTML = threads
          .map(
            (t, idx) =>
              `<span class="thread-pill ${idx === activeThreadIdx ? "active" : ""}" onclick="switchThread(${idx}, ${Number(t.xRatio) || 0.12}, ${Number(t.yRatio) || 0.25})">💬 ${esc(t.title || t.label || "会话")}</span>`
          )
          .join("");
      } else {
        tbar.style.display = "none";
      }

      // 2. Pure-Text Chat Bubbles
      const stream = document.getElementById("msg-stream");
      activeMessagesCache = messages;

      if (authRequired) {
        stream.innerHTML = `
          <div class="empty-state">
            🟠 该平台当前处于未登录状态。<br/>
            请在家里电脑打开《消息总管》扫码登录一次，后续手机即可随时看文字消息并直接回复。
          </div>`;
        return;
      }

      if (!messages.length) {
        stream.innerHTML = `
          <div class="msg-meta">最新消息摘要</div>
          <div class="msg-bubble peer">${esc(fallbackSnippet || errorHint || "当前窗口暂无更多历史聊天气泡，可在下方直接输入发送消息。")}</div>
        `;
        return;
      }

      stream.innerHTML = messages
        .map((m, mIdx) => {
          let extra = "";
          if (!m.isMe && Array.isArray(m.options) && m.options.length > 0) {
            if (m.answered) {
              extra = `<div class="ask-done-tag">✓ 你已拍板：${esc(m.answer)}</div>`;
            } else {
              extra = `<div class="ask-opts">${m.options
                .map(
                  (opt, oIdx) =>
                    `<button class="ask-opt-btn" onclick="pickAiOption(${mIdx}, ${oIdx})">${esc(opt)}</button>`
                )
                .join("")}</div>`;
            }
          }
          return `<div class="msg-bubble ${m.isMe ? "me" : "peer"}">${esc(m.text)}${extra}</div>`;
        })
        .join("");
      stream.scrollTop = stream.scrollHeight;
    }

    async function pickAiOption(msgIdx, optIdx) {
      const m = activeMessagesCache[msgIdx];
      if (!m || !activeChannel) return;
      const chosen = (m.options || [])[optIdx];
      if (!chosen) return;
      await api("/api/ai-inbox/reply", {
        method: "POST",
        body: JSON.stringify({
          channelId: m.channelId || activeChannel.channelId || activeChannel.title,
          requestId: m.requestId || "",
          text: chosen,
        }),
      });
      showToast("✅ 已把决定传回电脑 AI，AI 已继续执行！");
      await refreshActiveChannel(false);
    }

    async function switchThread(idx, xRatio, yRatio) {
      if (!activeChannel) return;
      activeThreadIdx = idx;
      showToast("正在切换会话...");
      if (activeChannel.kind === "web") {
        await api(`/api/remote/tab/${encodeURIComponent(activeChannel.id)}/action`, {
          method: "POST",
          body: JSON.stringify({ type: "click", xRatio, yRatio }),
        });
      } else if (activeChannel.kind === "app" && activeChannel.windowId) {
        const res = await api(`/api/desktop/window/${activeChannel.windowId}/action`, {
          method: "POST",
          body: JSON.stringify({ type: "selectThread", xRatio, yRatio }),
        });
        if (res.messages) {
          renderPureTextConversation({ threads: res.threads || [], messages: res.messages });
          return;
        }
      }
      await refreshActiveChannel(false);
    }

    /* ---------------- Direct Reply + Spintax Quick Replies ---------------- */
    function renderButlerDraftBar(ch) {
      const box = document.getElementById("butler-draft-box");
      if (!box || !ch) return;
      const sugMap = aiButlerState.suggestions || {};
      const sug = sugMap[ch.key] || (ch.appMatchKey ? sugMap[ch.appMatchKey] : null);
      if (!sug || (!sug.summary && !(sug.suggestedReplies || []).length)) {
        box.style.display = "none";
        return;
      }
      const draftsHtml = (sug.suggestedReplies || [])
        .map(
          (r, i) => `
          <div style="display:flex;gap:6px;align-items:center;margin-top:6px;">
            <button class="btn primary" style="flex:1;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.35;border-radius:10px;padding:7px 10px;" onclick="sendButlerSuggestedReply(${i})">🚀 直接发：${esc(r)}</button>
            <button class="btn" style="flex-shrink:0;padding:7px 9px;" onclick="fillButlerSuggestedReply(${i})">改字</button>
          </div>`
        )
        .join("");
      box.innerHTML = `
        <div style="font-size:12px;font-weight:800;color:#93c5fd;">🧠 AI 个人助理已看完来信：${esc(sug.summary || "")}</div>
        ${draftsHtml}
      `;
      box.style.display = "block";
    }

    function fillButlerSuggestedReply(idx) {
      if (!activeChannel) return;
      const sugMap = aiButlerState.suggestions || {};
      const sug = sugMap[activeChannel.key] || (activeChannel.appMatchKey ? sugMap[activeChannel.appMatchKey] : null);
      const txt = sug?.suggestedReplies?.[idx];
      if (!txt) return;
      const inp = document.getElementById("reply-input");
      inp.value = txt;
      onReplyInput();
      inp.focus();
    }

    async function sendButlerSuggestedReply(idx) {
      fillButlerSuggestedReply(idx);
      await sendActiveReply();
    }

    function renderChatQuickReplyChips() {
      const box = document.getElementById("chat-qr-chips");
      const qrs = hubState.quickReplies || [];
      box.innerHTML = qrs
        .map(
          (q, i) =>
            `<span class="qr-chip" onclick="fillQuickReply(${i})">⚡ ${esc(q.title || q.titleZh || "快捷话术")}</span>`
        )
        .join("");
    }

    function fillQuickReply(idx) {
      const q = (hubState.quickReplies || [])[idx];
      if (!q) return;
      const inp = document.getElementById("reply-input");
      inp.value = spinText(q.body || q.template || q.text || q.textZh || "");
      onReplyInput();
      inp.focus();
    }

    function onReplyInput() {
      const inp = document.getElementById("reply-input");
      const warn = document.getElementById("sensitive-warn");
      const val = inp.value || "";
      const hit = SENSITIVE_PATTERNS.find((p) => p.re.test(val));
      if (hit && activeChannel?.kind === "web") {
        warn.textContent = "⚠️ 检测到 " + hit.label;
        warn.style.display = "block";
      } else {
        warn.style.display = "none";
      }
    }

    async function sendActiveReply() {
      if (!activeChannel) return;
      const inp = document.getElementById("reply-input");
      const rawText = inp.value.trim();
      if (!rawText) return;
      const finalText = spinText(rawText);

      const btn = document.getElementById("send-btn");
      btn.disabled = true;
      inp.value = "";
      onReplyInput();

      // Optimistically render user's message bubble immediately
      const stream = document.getElementById("msg-stream");
      const b = document.createElement("div");
      b.className = "msg-bubble me";
      b.textContent = finalText;
      stream.appendChild(b);
      stream.scrollTop = stream.scrollHeight;

      try {
        if (activeChannel.kind === "web") {
          const out = await api(`/api/remote/tab/${encodeURIComponent(activeChannel.id)}/action`, {
            method: "POST",
            body: JSON.stringify({ type: "reply", text: finalText, autoSubmit: true }),
          });
          if (out.ok === false) showToast("⚠️ " + (out.error || "发送未确认"));
          else showToast("✅ 已由电脑固定网络发出");
          setTimeout(() => refreshActiveChannel(false), 1200);
        } else if (activeChannel.kind === "app") {
          const out = await api(`/api/desktop/window/${activeChannel.windowId}/action`, {
            method: "POST",
            body: JSON.stringify({ type: "reply", text: finalText, submitMode: "enter" }),
          });
          if (out.messages) {
            renderPureTextConversation({ threads: out.threads || [], messages: out.messages });
          }
          showToast("✅ 已通过电脑软件发出");
        } else if (activeChannel.kind === "cc") {
          if (activeChannel.subKind === "ai-inbox") {
            const out = await api("/api/ai-inbox/reply", {
              method: "POST",
              body: JSON.stringify({
                channelId: activeChannel.channelId || activeChannel.title,
                text: finalText,
              }),
            });
            showToast(
              out.deliveredLiveToWaitingAi
                ? "✅ 已实时传回等待中的电脑 AI！"
                : "✅ 留言已存入 AI 收件箱，AI 随时可读取"
            );
            setTimeout(() => refreshActiveChannel(false), 400);
          } else {
            let sid = activeChannel.sessionId;
            if (!sid) {
              const cr = await api("/api/cc/sessions", { method: "POST", body: JSON.stringify({}) });
              sid = cr.session?.id;
              activeChannel.sessionId = sid;
              activeChannel.key = `cc:${sid}`;
            }
            await api(`/api/cc/sessions/${encodeURIComponent(sid)}/send`, {
              method: "POST",
              body: JSON.stringify({ prompt: finalText }),
            });
            showToast("⏳ 指令已发给电脑 AI 执行，完成后自动提醒您");
            setTimeout(() => refreshActiveChannel(false), 1500);
          }
        }
      } catch (err) {
        showToast("发送失败: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    /* ---------------- Quick Replies & Leads Management ---------------- */
    function renderQuickRepliesManage() {
      const box = document.getElementById("qr-manage-list");
      const qrs = hubState.quickReplies || [];
      box.innerHTML = qrs
        .map(
          (q, i) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);gap:8px">
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:700">${esc(q.title || q.titleZh || "快捷话术")}</div>
              <div style="font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(q.body || q.template || q.text || q.textZh || "")}</div>
            </div>
            <button class="btn" style="padding:3px 8px;font-size:11px" onclick="removeQuickReply(${i})">删</button>
          </div>`
        )
        .join("");
    }

    async function addQuickReply() {
      const title = document.getElementById("new-qr-title").value.trim();
      const template = document.getElementById("new-qr-text").value.trim();
      if (!title || !template) return showToast("请填写简称和话术内容");
      const next = [...(hubState.quickReplies || []), { id: "qr_" + Date.now(), title, titleZh: title, body: template, template, textZh: template }];
      const res = await api("/api/quick-replies", { method: "POST", body: JSON.stringify({ quickReplies: next }) });
      hubState.quickReplies = res.quickReplies || next;
      document.getElementById("new-qr-title").value = "";
      document.getElementById("new-qr-text").value = "";
      renderQuickRepliesManage();
      showToast("✅ 已保存快捷话术");
    }

    async function removeQuickReply(idx) {
      const next = (hubState.quickReplies || []).filter((_, i) => i !== idx);
      const res = await api("/api/quick-replies", { method: "POST", body: JSON.stringify({ quickReplies: next }) });
      hubState.quickReplies = res.quickReplies || next;
      renderQuickRepliesManage();
    }

    async function scanLeads() {
      const q = document.getElementById("lead-q").value.trim();
      const box = document.getElementById("lead-list");
      box.innerHTML = "⏳ 正在全网扫描最新求购意向...";
      const res = await api(`/api/scan-leads?q=${encodeURIComponent(q)}&limit=10`);
      const items = res.leads || res.items || [];
      if (!items.length) {
        box.innerHTML = "暂未扫到对应新帖，可换个关键词试试。";
        return;
      }
      box.innerHTML = items
        .map(
          (it) => `
          <div style="padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
            <a href="${esc(it.url)}" target="_blank" style="color:#93c5fd;font-weight:700;text-decoration:none;font-size:13.5px">${esc(it.title)}</a>
            <div style="font-size:11.5px;color:var(--sub);margin-top:3px">${esc(it.source || "")} · ${esc(it.snippet || "")}</div>
          </div>`
        )
        .join("");
    }

    /* ---------------- Add Watch / Open App Sheet ---------------- */
    function openAddSheet() {
      const appsBox = document.getElementById("installed-apps-box");
      const apps = desktopState.installedApps || [];
      appsBox.innerHTML = apps.length
        ? apps
            .slice(0, 18)
            .map(
              (a) =>
                `<button class="btn" style="font-size:12px" onclick="launchDesktopApp('${esc(a.path)}','${esc(a.name)}')">💻 ${esc(a.name)}</button>`
            )
            .join("")
        : `<span style="font-size:12px;color:var(--sub)">正在读取电脑已装软件...</span>`;
      document.getElementById("add-sheet").classList.add("open");
    }

    function closeAddSheet() {
      document.getElementById("add-sheet").classList.remove("open");
    }

    async function createWebWatch() {
      const name = document.getElementById("add-web-name").value.trim();
      const url = document.getElementById("add-web-url").value.trim();
      if (!name || !url) return showToast("请填写平台名称和网址");
      await api("/api/watches", { method: "POST", body: JSON.stringify({ name, url, checkIntervalMinutes: 2 }) });
      document.getElementById("add-web-name").value = "";
      document.getElementById("add-web-url").value = "";
      closeAddSheet();
      showToast("✅ 已加入监控列表");
      await pollAll();
    }

    async function launchDesktopApp(appPath, name) {
      showToast(`正在电脑上打开 ${name}...`);
      await api("/api/desktop/launch", { method: "POST", body: JSON.stringify({ path: appPath }) });
      closeAddSheet();
      setTimeout(pollAll, 1200);
    }

    async function createCcSession() {
      const cwd = document.getElementById("add-cc-cwd").value.trim();
      const res = await api("/api/cc/sessions", { method: "POST", body: JSON.stringify({ cwd }) });
      closeAddSheet();
      await pollAll();
      if (res.session?.id) openChannelByKey(`cc:${res.session.id}`);
    }

    /* ---------------- Background Sync Loop & Hash Deep-Link ---------------- */
    async function pollCcOnly() {
      const c = await api("/api/cc/state").catch(() => null);
      if (c && c.ok) ccState = c;
    }

    async function pollAll() {
      try {
        const [s, d, c, ai, bt] = await Promise.all([
          api("/api/state").catch(() => null),
          api("/api/desktop/state").catch(() => null),
          api("/api/cc/state").catch(() => null),
          api("/api/ai-inbox/state").catch(() => null),
          api("/api/ai-butler/state").catch(() => null),
        ]);
        if (s && s.watches) hubState = s;
        if (d && (d.windows || d.badges)) desktopState = d;
        if (ai && ai.channels) aiInboxState = ai;
        if (bt && bt.suggestions) {
          aiButlerState = bt;
          if (activeChannel) renderButlerDraftBar(activeChannel);
        }
        if (c && c.ok) {
          // Mark finished CC sessions unread if they transitioned from running -> done
          for (const ns of c.sessions || []) {
            const old = (ccState.sessions || []).find((o) => o.id === ns.id);
            if (old && old.status === "running" && ns.status !== "running") {
              ccUnreadSet.add(`cc:${ns.id}`);
            }
          }
          ccState = c;
        }

        unifiedChannels = buildUnifiedChannels();
        checkIncomingAlertsAndBadges(unifiedChannels);
        renderChannelList();

        // Keep open CC running output live-updated
        if (activeChannel && activeChannel.kind === "cc") {
          const sObj = (ccState.sessions || []).find((x) => x.id === activeChannel.sessionId);
          if (sObj && sObj.status === "running") {
            refreshActiveChannel(false);
          }
        }
      } catch {}
    }

    function checkHashDeepLink() {
      const m = location.hash.match(/^#open=(.+)$/);
      if (m) {
        const key = decodeURIComponent(m[1]);
        openChannelByKey(key);
      }
    }
    window.addEventListener("hashchange", checkHashDeepLink);

    (async function boot() {
      initServiceWorkerAndPushStatus();
      await pollAll();
      checkHashDeepLink();
      setInterval(pollAll, 3500);
    })();
  </script>
</body>
</html>
